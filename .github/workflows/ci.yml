name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check (repository Prettier config)
        run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build (web + server, verifies slide class safelist)
        run: pnpm build

  python:
    name: ASR service (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/asr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/asr/pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The GPU extra (torch/funasr) is intentionally not installed: inference is mocked.
      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: ruff format --check .

      - name: Import API and provider modules without GPU dependencies
        run: python -c "import app.main, app.providers.funasr_nano; from app.config import load_settings; load_settings({})"

      - run: pytest

  docker:
    name: Docker configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          docker compose config --quiet
          docker compose --env-file .env.example config --quiet

      # The CUDA/PyTorch ASR image is several GB; lint its Dockerfile instead of building it on every run.
      - name: Check ASR Dockerfile
        run: docker build --check services/asr

      - uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: innoverse-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test app image
        run: |
          docker run -d --name app -p 3000:3000 -e ASR_URL=http://127.0.0.1:9 innoverse-app:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/health
          curl -sf http://127.0.0.1:3000/ | grep -q '<div id="root">'
          docker stop -t 20 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = "0"
