[project]
name = "innoverse-asr"
version = "0.1.0"
description = "Local GPU speech recognition service (Fun-ASR-Nano-2512 by default)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "opencc==1.4.2",
]

[project.optional-dependencies]
# Heavy inference stack. Install torch/torchaudio from the matching CUDA wheel index
# (see Dockerfile); CI never installs this group.
gpu = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "funasr==1.4.16",
]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.16.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
